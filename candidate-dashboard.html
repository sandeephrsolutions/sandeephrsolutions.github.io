<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate Dashboard | Sandeep HR Solutions</title>
<link rel="icon" href="Logo.png" type="image/png"><style>
:root{--navy:#071b34;--blue:#123f68;--gold:#f4b83f;--ink:#162536;--muted:#6b7785;--line:#e4e9ef;--bg:#f5f8fc}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
a{text-decoration:none;color:inherit}.top{background:var(--navy);color:#fff}.wrap{max-width:1050px;margin:auto;padding:0 18px}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:10px;background:#fff}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#f4b83f;font-size:8px;letter-spacing:1px;margin-top:3px}
.nav-links{display:flex;gap:8px;align-items:center}.nav-links a{color:#fff;font-size:12px;font-weight:700;padding:10px 11px;border-radius:9px}.nav-links a:hover{background:#ffffff12}.nav-links .active{background:#f4b83f;color:#071b34}
.hero{padding:54px 0 34px;background:linear-gradient(135deg,#071b34,#123f68);color:#fff}.hero h1{font-size:40px;margin:0 0 12px}.hero p{color:#d9e3ed;max-width:650px;line-height:1.7;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 42px #071b3410;padding:26px}
.panel{max-width:720px;margin:-20px auto 55px;position:relative}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#334155}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e9;border-radius:11px;background:#fbfcfe;padding:12px 13px;font:inherit;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4d86b8;box-shadow:0 0 0 3px #4d86b81a;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:11px;padding:0 18px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:var(--navy)}.secondary{background:#edf3f8;color:var(--navy)}.danger{background:#feecec;color:#a52828}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.notice{display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a52828;border:1px solid #f2cccc}.notice.success{background:#eefaf1;color:#23723b;border:1px solid #ccebd5}
.small{font-size:12px;color:var(--muted);line-height:1.5}.center{text-align:center}.link{color:#145b91;font-weight:700}.divider{height:1px;background:var(--line);margin:20px 0}
footer{padding:30px 0;text-align:center;color:#6b7785;font-size:12px}.profile-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.profile-head h2{margin:0}.pill{display:inline-flex;padding:7px 10px;border-radius:30px;background:#eef6ff;color:#155a91;font-size:11px;font-weight:800}
@media(max-width:700px){.nav-links{display:none}.nav{min-height:66px}.hero{padding:44px 0 28px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{margin:-10px 0 35px}.card{padding:20px}.profile-head{align-items:flex-start;flex-direction:column}.actions .btn{width:100%}}
</style></head>
<body>
<header class="top"><div class="wrap nav">
<a class="brand" href="index.html"><img src="Logo.png" alt="Sandeep HR Solutions logo"><span><strong>Sandeep HR Solutions</strong><small>HR • RECRUITMENT • CONSULTING</small></span></a>
<div class="nav-links"><a href="index.html">Home</a><a href="#" id="logout">Logout</a></div>
</div></header>
<section class="hero"><div class="wrap"><h1>Candidate Dashboard</h1><p>Keep your profile updated so your professional information stays current.</p></div></section>
<main class="wrap"><div class="card">
<div class="profile-head"><div><h2 id="welcome">Your Profile</h2><span class="pill">PRIVATE CANDIDATE PROFILE</span></div></div>
<div id="notice" class="notice"></div>
<form id="profileForm">
<div class="grid">
<div class="field"><label>Full Name *</label><input id="fullName" required></div>
<div class="field"><label>Mobile Number *</label><input id="mobile" required inputmode="tel"></div>
<div class="field"><label>Email</label><input id="email" type="email" disabled></div>
<div class="field"><label>Qualification</label><input id="qualification"></div>
<div class="field"><label>Total Experience</label><input id="experience"></div>
<div class="field"><label>Current Designation</label><input id="designation"></div>
<div class="field"><label>Current Company</label><input id="company"></div>
<div class="field"><label>Current Salary</label><input id="currentSalary"></div>
<div class="field"><label>Expected Salary</label><input id="expectedSalary"></div>
<div class="field"><label>Preferred Location</label><input id="location"></div>
<div class="field"><label>Notice Period</label><input id="noticePeriod"></div>
<div class="field"><label>Key Skills</label><input id="skills"></div>
<div class="field full"><label>Resume / LinkedIn Profile</label><input id="resumeUrl" type="url"></div>
</div>
<div class="actions"><button class="btn primary" type="submit">Save Changes</button><button class="btn danger" type="button" id="logout2">Logout</button></div>
</form>
</div></main>
<footer>Sandeep HR Solutions • Candidate Portal</footer>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const $=id=>document.getElementById(id), notice=$("notice");
const show=(msg,type="error")=>{notice.textContent=msg;notice.className="notice show "+type;};
const fields=["fullName","mobile","qualification","experience","designation","company","currentSalary","expectedSalary","location","noticePeriod","skills","resumeUrl"];
async function logout(){await signOut(auth);location.href="candidate-login.html";}
$("logout").addEventListener("click",e=>{e.preventDefault();logout();});$("logout2").addEventListener("click",logout);
onAuthStateChanged(auth,async user=>{
 if(!user) return location.href="candidate-login.html";
 $("email").value=user.email||"";
 try{
  const snap=await getDoc(doc(db,"candidates",user.uid));
  if(snap.exists()){
   const data=snap.data(); fields.forEach(k=>$(k).value=data[k]||""); $("welcome").textContent="Hello, "+(data.fullName||"Candidate");
  }
 }catch(err){show("Could not load your profile: "+err.message);}
});
$("profileForm").addEventListener("submit",async e=>{
 e.preventDefault(); const user=auth.currentUser; if(!user) return location.href="candidate-login.html";
 const data={}; fields.forEach(k=>data[k]=$(k).value.trim()); data.email=user.email||""; data.updatedAt=serverTimestamp();
 try{await setDoc(doc(db,"candidates",user.uid),data,{merge:true});show("Profile updated successfully.","success");}
 catch(err){show("Could not save your profile: "+err.message);}
});
</script></body></html>
