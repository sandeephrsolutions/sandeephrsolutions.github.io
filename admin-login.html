<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | Sandeep Solutions</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth"><div class="auth-card"><img class="auth-logo" src="assets/logo.png" alt="Sandeep Solutions"><div class="kicker" style="text-align:center">Private Admin Area</div><h1>Admin Login</h1><p>Sign in to manage jobs, enquiries and website content.</p><form id="login"><div class="field"><label>Email Address</label><input id="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required></div><button class="btn gold" style="width:100%;margin-top:15px">Login to Admin Dashboard →</button></form><p id="msg" style="display:none"></p><a class="link" href="index.html">← Back to Website</a></div></div><script type="module">import{auth}from"./firebase-config.js";import{signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";const ADMIN="sandeep.hr.solutions.shr@gmail.com";await signOut(auth);document.getElementById("login").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if((c.user.email||"").toLowerCase()!==ADMIN){await signOut(auth);throw Error("Unauthorized admin account");}location.href="admin-dashboard.html"}catch(x){m.textContent="Login failed or account not authorized.";m.style.display="block";m.style.color="#b42318"}};</script></body></html>
