<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Sandeep HR Solutions</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#071b34,#123f70);min-height:100vh;display:grid;place-items:center;padding:20px;color:#172033}
.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 24px 70px #0005}
h1{margin:0 0 8px;font-size:28px}.muted{color:#68758a;font-size:14px;margin:0 0 25px}
label{display:block;font-weight:700;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d7e0ea;border-radius:12px;font-size:15px}
button{width:100%;margin-top:22px;border:0;border-radius:12px;padding:14px;background:#f4b83f;color:#071b34;font-weight:800;font-size:15px;cursor:pointer}
.msg{margin-top:14px;padding:11px;border-radius:10px;font-size:13px;display:none}.err{background:#fff0f0;color:#a32929}.ok{background:#eefaf2;color:#176b38}
.back{display:block;margin-top:18px;text-align:center;color:#315b88;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Admin Login</h1><p class="muted">Sandeep HR Solutions — private administration</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" value="sandeep.hr.solutions.shr@gmail.com" required>
<label>Password</label><input id="password" type="password" required autocomplete="current-password">
<button type="submit">Login to Admin Dashboard →</button>
</form>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← Back to website</a>
</div>
<script type="module">
import {auth} from "./firebase-config.js";
import {signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const ADMIN_EMAIL="sandeep.hr.solutions.shr@gmail.com";
const form=document.getElementById("loginForm"), msg=document.getElementById("msg");
function show(t,ok=false){msg.textContent=t;msg.className="msg "+(ok?"ok":"err");msg.style.display="block";}
onAuthStateChanged(auth,u=>{if(u && u.email===ADMIN_EMAIL) location.href="admin-dashboard.html";});
form.addEventListener("submit",async e=>{
 e.preventDefault(); show("Signing in…",true);
 try{const c=await signInWithEmailAndPassword(auth,form.email.value.trim(),form.password.value);
 if(c.user.email!==ADMIN_EMAIL){await auth.signOut();show("This account is not authorized for admin access.");return;}
 location.href="admin-dashboard.html";
 }catch(err){show("Login failed. Please check your email and password.");}
});
</script>
</body></html>
