<!doctype html>
<html lang="en"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Candidate Login | Sandeep Solutions</title>
<link rel="icon" href="brand-mark.png" type="image/png"><style>
:root{--navy:#071b34;--blue:#123f68;--gold:#f4b83f;--ink:#162536;--muted:#6b7785;--line:#e4e9ef;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}.top{background:var(--navy);color:#fff}.wrap{max-width:1050px;margin:auto;padding:0 18px}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:10px;background:#fff}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#f4b83f;font-size:8px;letter-spacing:1px;margin-top:3px}.nav-links{display:flex;gap:8px;align-items:center}.nav-links a{color:#fff;font-size:12px;font-weight:700;padding:10px 11px;border-radius:9px}.nav-links a:hover{background:#ffffff12}.nav-links .active{background:#f4b83f;color:#071b34}.hero{padding:54px 0 34px;background:linear-gradient(135deg,#071b34,#123f68);color:#fff}.hero h1{font-size:40px;margin:0 0 12px}.hero p{color:#d9e3ed;max-width:650px;line-height:1.7;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 42px #071b3410;padding:26px}.panel{max-width:720px;margin:-20px auto 55px;position:relative}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#334155}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e9;border-radius:11px;background:#fbfcfe;padding:12px 13px;font:inherit;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4d86b8;box-shadow:0 0 0 3px #4d86b81a;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:11px;padding:0 18px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:var(--navy)}.secondary{background:#edf3f8;color:var(--navy)}.danger{background:#feecec;color:#a52828}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.notice{display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a52828;border:1px solid #f2cccc}.notice.success{background:#eefaf1;color:#23723b;border:1px solid #ccebd5}.small{font-size:12px;color:var(--muted);line-height:1.5}.center{text-align:center}.link{color:#145b91;font-weight:700}.divider{height:1px;background:var(--line);margin:20px 0}footer{padding:30px 0;text-align:center;color:#6b7785;font-size:12px}@media(max-width:700px){.nav-links{display:none}.nav{min-height:66px}.hero{padding:44px 0 28px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{margin:-10px 0 35px}.card{padding:20px}.actions .btn{width:100%}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img src="brand-mark.png" alt="Sandeep Solutions logo"><span><strong>Sandeep Solutions</strong><small>HR &amp; RECRUITMENT • BUSINESS SUPPORT</small></span></a><div class="nav-links"><a href="index.html">Home</a><a href="candidate-register.html">Register</a></div></div></header>
<section class="hero"><div class="wrap"><h1>Candidate Login</h1><p>Access your profile, update your professional details and keep your information current.</p></div></section>
<main class="wrap"><div class="card panel"><div id="notice" class="notice"></div><form id="loginForm"><div class="field"><label>Email Address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><div class="actions"><button class="btn primary" type="submit">Login</button><button class="btn secondary" type="button" id="resetBtn">Forgot Password?</button></div></form><div class="divider"></div><div class="center small">New candidate? <a class="link" href="candidate-register.html">Create your profile</a></div></div></main>
<footer>Sandeep Solutions • Candidate Portal</footer>
<script type="module">
import { auth } from "./firebase-config.js";import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const $=id=>document.getElementById(id),notice=$("notice");const show=(msg,type="error")=>{notice.textContent=msg;notice.className="notice show "+type;};onAuthStateChanged(auth,user=>{if(user) location.href="candidate-dashboard.html";});$("loginForm").addEventListener("submit",async e=>{e.preventDefault();show("Signing in...","success");try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);location.href="candidate-dashboard.html";}catch(err){show(err.code==="auth/invalid-credential"?"Email or password is incorrect.":err.message);}});$("resetBtn").addEventListener("click",async()=>{const email=$("email").value.trim();if(!email)return show("Enter your email address first.");try{await sendPasswordResetEmail(auth,email);show("Password reset email sent. Check your inbox.","success");}catch(err){show(err.message);}});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", {scope: "/"})
      .catch(function (error) { console.warn("Sandeep Solutions PWA service worker:", error); });
  });
}
</script>

</body></html>
