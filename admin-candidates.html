<!doctype html>
<html lang="en">
<head><meta name="theme-color" content="#071B34">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Candidate Management | Sandeep Solutions</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#172033}.top{background:#071b34;color:#fff;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:800;font-size:12px;cursor:pointer}.light{background:#fff;color:#123f70}.gold{background:#f4b83f;color:#071b34}main{width:min(1180px,92%);margin:28px auto 50px}.head h1{margin:0 0 5px;font-size:29px}.head p{margin:0;color:#68758a;font-size:13px}.stat,.card{background:#fff;border:1px solid #e0e7ef;border-radius:16px;padding:17px;margin-top:16px}.stat{border-radius:17px}.num{font-size:29px;font-weight:900;color:#071b34;margin-top:6px}.card h3{margin:0 0 4px;font-size:16px}.meta{font-size:11px;color:#68758a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:13px}.item{font-size:12px;color:#5e6c7e}.item b{color:#26354b}.full{grid-column:1/-1}.resume{color:#145b91;font-weight:800;text-decoration:none}.delete{border:0;border-radius:8px;padding:9px 13px;background:#feecec;color:#a52828;font-weight:800;cursor:pointer}.empty{color:#68758a;font-size:13px;padding:15px 0}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header class="top"><div class="brand">SANDEEP SOLUTIONS · ADMIN</div><div class="actions"><a class="btn gold" href="admin-dashboard.html">← Admin Dashboard</a><a class="btn light" href="admin-jobs.html">Job Management</a><a class="btn light" href="index.html">Website</a><button class="btn light" id="logout">Logout</button></div></header>
<main><section class="head"><h1>Candidate Management</h1><p>View complete candidate profiles. Employer enquiries are kept separate.</p></section>
<div class="stat"><small>Total Candidates</small><div class="num" id="count">—</div></div><div id="list"><div class="empty">Loading candidates…</div></div></main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {collection,getDocs,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {startAdminSessionTimeout} from "./admin-session.js";
const ADMIN_EMAIL="sandeep.hr.solutions.shr@gmail.com",list=document.getElementById("list");
onAuthStateChanged(auth,async u=>{if(!u||u.email!==ADMIN_EMAIL){location.href="admin-login.html";return;}startAdminSessionTimeout(auth);try{const snap=await getDocs(collection(db,"candidates"));document.getElementById("count").textContent=snap.size;if(!snap.size){list.innerHTML='<div class="empty">No candidate profiles found.</div>';return;}const rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));rows.sort((a,b)=>String(a.fullName||"").localeCompare(String(b.fullName||"")));list.innerHTML=rows.map(r=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3>${esc(r.fullName||"Candidate")}</h3><div class="meta">${esc(r.email||"No email")} · ${esc(r.mobile||"No mobile")}</div></div><button class="delete" data-delete="${r.id}" type="button">🗑 Delete Candidate</button></div><div class="grid"><div class="item"><b>Qualification:</b> ${esc(r.qualification||"Not provided")}</div><div class="item"><b>Experience:</b> ${esc(r.experience||"Not provided")}</div><div class="item"><b>Designation:</b> ${esc(r.designation||"Not provided")}</div><div class="item"><b>Current Company:</b> ${esc(r.company||"Not provided")}</div><div class="item"><b>Current Salary:</b> ${esc(r.currentSalary||"Not provided")}</div><div class="item"><b>Expected Salary:</b> ${esc(r.expectedSalary||"Not provided")}</div><div class="item"><b>Preferred Location:</b> ${esc(r.location||"Not provided")}</div><div class="item"><b>Notice Period:</b> ${esc(r.noticePeriod||"Not provided")}</div><div class="item full"><b>Key Skills:</b> ${esc(r.skills||"Not provided")}</div><div class="item full"><b>Resume / LinkedIn:</b> ${r.resumeUrl?`<a class="resume" target="_blank" rel="noopener" href="${esc(r.resumeUrl)}">Open Profile / Resume</a>`:"Not provided"}</div></div></article>`).join("");list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const card=b.closest(".card"),name=card?.querySelector("h3")?.textContent||"this candidate";if(!confirm("Delete "+name+" permanently?\n\nThis will remove the complete candidate profile and cannot be undone."))return;b.disabled=true;b.textContent="Deleting…";try{await deleteDoc(doc(db,"candidates",b.dataset.delete));alert("Candidate deleted successfully.");location.reload();}catch(e){console.error(e);b.disabled=false;b.textContent="🗑 Delete Candidate";alert("Delete failed. Please check Firestore rules.");}});}catch(e){console.error(e);list.innerHTML='<div class="empty">Could not load candidate profiles. Please check Firestore rules.</div>';}});document.getElementById("logout").onclick=async()=>{await signOut(auth);location.href="admin-login.html";};function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", {scope: "/"})
      .catch(function (error) { console.warn("Sandeep Solutions PWA service worker:", error); });
  });
}
</script>

</body></html>
