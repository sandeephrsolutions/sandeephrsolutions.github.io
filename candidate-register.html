<!doctype html>
<html lang="en"><head>
<meta name="theme-color" content="#071B34">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Candidate Registration | Sandeep Solutions</title>
<link rel="icon" href="brand-mark.png" type="image/png"><style>
:root{--navy:#071b34;--blue:#123f68;--gold:#f4b83f;--ink:#162536;--muted:#6b7785;--line:#e4e9ef;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}.top{background:var(--navy);color:#fff}.wrap{max-width:1050px;margin:auto;padding:0 18px}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:10px;background:#fff}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#f4b83f;font-size:8px;letter-spacing:1px;margin-top:3px}.nav-links{display:flex;gap:8px;align-items:center}.nav-links a{color:#fff;font-size:12px;font-weight:700;padding:10px 11px;border-radius:9px}.nav-links a:hover{background:#ffffff12}.nav-links .active{background:#f4b83f;color:#071b34}.hero{padding:54px 0 34px;background:linear-gradient(135deg,#071b34,#123f68);color:#fff}.hero h1{font-size:40px;margin:0 0 12px}.hero p{color:#d9e3ed;max-width:650px;line-height:1.7;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 42px #071b3410;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#334155}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e0e9;border-radius:11px;background:#fbfcfe;padding:12px 13px;font:inherit;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4d86b8;box-shadow:0 0 0 3px #4d86b81a;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:11px;padding:0 18px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:var(--navy)}.secondary{background:#edf3f8;color:var(--navy)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.notice{display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a52828;border:1px solid #f2cccc}.notice.success{background:#eefaf1;color:#23723b;border:1px solid #ccebd5}footer{padding:30px 0;text-align:center;color:#6b7785;font-size:12px}@media(max-width:700px){.nav-links{display:none}.nav{min-height:66px}.hero{padding:44px 0 28px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:20px}.actions .btn{width:100%}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img src="brand-mark.png" alt="Sandeep Solutions logo"><span><strong>Sandeep Solutions</strong><small>HR &amp; RECRUITMENT • BUSINESS SUPPORT</small></span></a><div class="nav-links"><a href="index.html">Home</a><a class="active" href="candidate-register.html">Register</a><a href="candidate-login.html">Login</a></div></div></header>
<section class="hero"><div class="wrap"><h1>Create Your Candidate Profile</h1><p>Create an account once. You can login later and edit your professional details whenever you need.</p></div></section>
<main class="wrap"><div class="card"><div id="notice" class="notice"></div><form id="registerForm"><div class="grid"><div class="field"><label>Full Name *</label><input id="fullName" required autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Mobile Number *</label><input id="mobile" required inputmode="tel" placeholder="10-digit mobile number"></div><div class="field"><label>Email Address *</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password *</label><input id="password" type="password" required minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters"></div><div class="field"><label>Confirm Password *</label><input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Re-enter password"></div><div class="field"><label>Qualification</label><input id="qualification" placeholder="Degree / certification"></div><div class="field"><label>Total Experience</label><input id="experience" placeholder="e.g. 3 years"></div><div class="field"><label>Current Designation</label><input id="designation" placeholder="Current job title"></div><div class="field"><label>Current Company</label><input id="company" placeholder="Current organization"></div><div class="field"><label>Current Salary</label><input id="currentSalary" placeholder="e.g. ₹5 LPA"></div><div class="field"><label>Expected Salary</label><input id="expectedSalary" placeholder="e.g. ₹7 LPA"></div><div class="field"><label>Preferred Location</label><input id="location" placeholder="e.g. Bengaluru / Remote"></div><div class="field"><label>Notice Period</label><input id="noticePeriod" placeholder="e.g. Immediate / 30 days"></div><div class="field"><label>Key Skills</label><input id="skills" placeholder="e.g. Recruitment, Excel, Payroll"></div><div class="field full"><label>Resume / LinkedIn Profile</label><input id="resumeUrl" type="url" placeholder="Optional public link"></div></div><div class="actions"><button class="btn primary" type="submit">Create Candidate Account</button><a class="btn secondary" href="candidate-login.html">Already have an account?</a></div></form></div></main>
<footer>Sandeep Solutions • Candidate Portal</footer>
<script type="module">
import { auth, db } from "./firebase-config.js";import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const $=id=>document.getElementById(id),notice=$("notice");const show=(msg,type="error")=>{notice.textContent=msg;notice.className="notice show "+type;};$("registerForm").addEventListener("submit",async e=>{e.preventDefault();if($("password").value!==$("confirmPassword").value)return show("Passwords do not match.");show("Creating your account...","success");try{const cred=await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);const p={fullName:$("fullName").value.trim(),mobile:$("mobile").value.trim(),email:$("email").value.trim(),qualification:$("qualification").value.trim(),experience:$("experience").value.trim(),designation:$("designation").value.trim(),company:$("company").value.trim(),currentSalary:$("currentSalary").value.trim(),expectedSalary:$("expectedSalary").value.trim(),location:$("location").value.trim(),noticePeriod:$("noticePeriod").value.trim(),skills:$("skills").value.trim(),resumeUrl:$("resumeUrl").value.trim(),updatedAt:serverTimestamp()};await setDoc(doc(db,"candidates",cred.user.uid),p);location.href="candidate-dashboard.html";}catch(err){show(err.code==="auth/email-already-in-use"?"This email is already registered. Please login.":err.message);}});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", {scope: "/"})
      .catch(function (error) { console.warn("Sandeep Solutions PWA service worker:", error); });
  });
}
</script>

</body></html>
